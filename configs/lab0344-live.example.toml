# Tokens live in one-line files outside this repository. CTPD itself requires
# its own API token for the /v1/ticks SSE endpoint.
account_id = "BULLET/lab0344-sim"
bind_address = "127.0.0.1:8091"
history_tail_bars = 600

[ctpd]
base_url = "http://127.0.0.1:8080"
bearer_token_file = "/etc/bullet/ctpd.token"
stale_after_ms = 10000

[remote_account]
# This is intentionally required rather than defaulted. With false, configure
# the same Authorization value in the 1Exchange Custom Account Source.
allow_unauthenticated = false
bearer_token_file = "/etc/bullet/remote-account.token"

# `symbol` identifies the E-Works continuous Parquet series. The currently
# tradable CTP contract must be updated at each roll; it is never inferred.
# For the CFFEX index-futures 09:30-11:30 / 13:00-15:00 session, Parquet has
# 240 one-minute bars labelled by their close endpoint. Row 220 ends at 14:40,
# the final row that can still have the required row-240 exit.
[[instruments]]
symbol = "IF"
ctpd_instrument_id = "IF2609"
parquet = "/var/lib/bullet/IF8888.parquet"
target_contracts = 1
contract_multiplier = 300.0
session_bar_count = 240
last_executable_signal_time = "14:40:00"
